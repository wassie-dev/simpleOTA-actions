name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks that need no SimpleOTA project: the shell logic, the manifest
  # shape, and that the signature we produce actually verifies.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: for s in scripts/*.sh; do bash -n "$s"; done

      - name: Every action.yml is a valid composite action
        run: |
          python3 - <<'PY'
          import yaml, pathlib, sys
          bad = 0
          for f in sorted(pathlib.Path('.').rglob('action.yml')):
              d = yaml.safe_load(f.read_text())
              runs = d.get('runs', {})
              if runs.get('using') != 'composite':
                  print(f"{f}: not composite"); bad += 1
              for s in runs.get('steps', []):
                  if 'run' in s and s.get('shell') != 'bash':
                      print(f"{f}: step '{s.get('name')}' missing shell: bash"); bad += 1
              for name, spec in d.get('inputs', {}).items():
                  if not spec.get('description'):
                      print(f"{f}: input '{name}' has no description"); bad += 1
          sys.exit(bad)
          PY

      - name: Manifest builder produces valid JSON and escapes correctly
        run: |
          set -euo pipefail
          OUT=$(FRAMEWORK=arduino VERSION_LABEL=1.2.3 CHIP_FAMILY=esp32 SECURITY_MODE=basic \
                ./scripts/manifest.sh)
          jq -e '.framework=="arduino" and .security_mode=="basic" and (has("board_id")|not)' <<<"$OUT" >/dev/null

          OUT=$(FRAMEWORK=arduino VERSION_LABEL=1.2.3 CHIP_FAMILY=esp32 BOARD_ID=devkit \
                SECURITY_MODE=signed KEY_ID=k SIGNATURE_B64=QUJD \
                RELEASE_NOTES='quote " newline
                and \ backslash' ./scripts/manifest.sh)
          jq -e '.signing_metadata.algorithm=="ed25519" and .board_id=="devkit"' <<<"$OUT" >/dev/null
          echo "manifest ok"

      - name: Security mode resolution
        run: |
          set -euo pipefail
          [ "$(SECURITY_MODE=auto SIGNING_KEY=x KEY_ID=k ./scripts/resolve-security-mode.sh)" = signed ]
          [ "$(SECURITY_MODE=auto ./scripts/resolve-security-mode.sh)" = basic ]
          # signed without a key id must fail loudly rather than upload unsigned
          if SECURITY_MODE=signed SIGNING_KEY=x ./scripts/resolve-security-mode.sh >/dev/null 2>&1; then
            echo "expected failure when key-id is missing"; exit 1
          fi
          echo "security mode ok"

      - name: Required inputs are enforced
        run: |
          set -euo pipefail
          # GitHub does not enforce `required: true` for composite actions, so
          # the action has to. An empty project-id must fail here rather than
          # becoming a malformed URL and a confusing HTTP error.
          if API_TOKEN=t PROJECT_ID= BINARY=x VERSION_LABEL=v CHIP_FAMILY=esp32 \
             ./scripts/require-inputs.sh API_TOKEN:api-token PROJECT_ID:project-id \
             BINARY:binary VERSION_LABEL:version-label CHIP_FAMILY:chip-family 2>/dev/null; then
            echo "empty project-id was accepted"; exit 1
          fi
          # and the happy path stays silent
          API_TOKEN=t PROJECT_ID=p BINARY=x VERSION_LABEL=v CHIP_FAMILY=esp32 \
            ./scripts/require-inputs.sh API_TOKEN:api-token PROJECT_ID:project-id \
            BINARY:binary VERSION_LABEL:version-label CHIP_FAMILY:chip-family
          echo "required inputs ok"

      - name: Signature verifies against the public key, and tampering fails
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/k.pem"
          openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -out "$RUNNER_TEMP/k.pub"
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/fw.bin"

          SIG=$(SIGNING_KEY="$(cat "$RUNNER_TEMP/k.pem")" BINARY="$RUNNER_TEMP/fw.bin" ./scripts/sign.sh)
          base64 -d <<<"$SIG" > "$RUNNER_TEMP/fw.sig"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/k.pub" -rawin \
            -in "$RUNNER_TEMP/fw.bin" -sigfile "$RUNNER_TEMP/fw.sig"

          printf 'x' >> "$RUNNER_TEMP/fw.bin"
          if openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/k.pub" -rawin \
               -in "$RUNNER_TEMP/fw.bin" -sigfile "$RUNNER_TEMP/fw.sig" 2>/dev/null; then
            echo "tampered binary verified, which must never happen"; exit 1
          fi

          # the private key must not survive the step
          ls "$RUNNER_TEMP"/simpleota-key.* 2>/dev/null && { echo "key left behind"; exit 1; } || true
          echo "signing ok"

  # Real upload against a live project. Only runs where the secrets exist, so
  # forks and contributors are not blocked by it.
  # Exercises every action against a real SimpleOTA project.
  #
  # The unit job proves the YAML parses and the shell runs. It cannot prove a
  # URL exists: v1.0.1 shipped `deploy` and `promote` posting transitions to
  # /deployments/{id}/actions/, which was never a route, and it passed CI
  # because `upload` was the only action ever run live. So this walks the whole
  # chain, both transition call sites included.
  #
  # Each run consumes two of the test project's monthly artifact uploads, so it
  # is limited to main and manual runs rather than every branch push.
  integration:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      API_TOKEN:  ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
      PROJECT_ID: ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
      BASE_URL:   ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without credentials
        id: gate
        run: |
          set -euo pipefail
          missing=""
          [ -n "${API_TOKEN:-}" ]  || missing="$missing SIMPLEOTA_TEST_API_TOKEN(secret)"
          [ -n "${PROJECT_ID:-}" ] || missing="$missing SIMPLEOTA_TEST_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Live tests skipped. Missing:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy targets channels by UUID, not by name, so look it up rather
      # than carry another repository variable that could drift.
      - name: Resolve the stable channel id
        if: steps.gate.outputs.run == 'true'
        id: chan
        run: |
          set -euo pipefail
          resp="$(./scripts/api.sh \
            "${BASE_URL%/}/api/v1/projects/${PROJECT_ID}/channels/" \
            -H "Authorization: Bearer ${API_TOKEN}")"
          id="$(jq -r '.[] | select(.name == "stable") | .id' <<<"$resp")"
          if [ -z "$id" ]; then
            echo "::error::the test project has no release channel named 'stable'"
            exit 1
          fi
          echo "channel-id=$id" >> "$GITHUB_OUTPUT"

      - name: Build throwaway binaries
        if: steps.gate.outputs.run == 'true'
        run: |
          head -c 65536 /dev/urandom > firmware.bin
          head -c 65536 /dev/urandom > firmware-release.bin

      # --- upload -> deploy -> promote, the three-step flow -----------------

      - name: upload
        if: steps.gate.outputs.run == 'true'
        id: up
        uses: ./upload
        with:
          api-token:     ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:    ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          binary:        firmware.bin
          version-label: ci-${{ github.run_number }}
          chip-family:   esp32
          base-url:      ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: deploy the artifact as a 10% canary, started
        if: steps.gate.outputs.run == 'true'
        id: dep
        uses: ./deploy
        with:
          api-token:          ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:         ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          artifact-id:        ${{ steps.up.outputs.artifact-id }}
          channel-ids:        ${{ steps.chan.outputs.channel-id }}
          rollout-strategy:   canary
          rollout-percentage: '10'
          notes:              "CI run ${{ github.run_number }}"
          base-url:           ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: promote ramps the canary to 50%
        if: steps.gate.outputs.run == 'true'
        id: ramp
        uses: ./promote
        with:
          api-token:          ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:         ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          deployment-id:      ${{ steps.dep.outputs.deployment-id }}
          action:             ramp
          rollout-percentage: '50'
          base-url:           ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: promote pauses it
        if: steps.gate.outputs.run == 'true'
        id: pause
        uses: ./promote
        with:
          api-token:     ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:    ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          deployment-id: ${{ steps.dep.outputs.deployment-id }}
          action:        pause
          base-url:      ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: promote resumes it
        if: steps.gate.outputs.run == 'true'
        id: resume
        uses: ./promote
        with:
          api-token:     ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:    ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          deployment-id: ${{ steps.dep.outputs.deployment-id }}
          action:        resume
          base-url:      ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: the three-step flow reported the states we expect
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -n "${{ steps.up.outputs.build-number }}"
          test -n "${{ steps.up.outputs.artifact-id }}"
          test -n "${{ steps.dep.outputs.deployment-id }}"
          # deploy defaults start:true, so the deployment must already be live.
          test "${{ steps.dep.outputs.state }}"    = "active"
          test "${{ steps.ramp.outputs.state }}"   = "active"
          test "${{ steps.pause.outputs.state }}"  = "paused"
          test "${{ steps.resume.outputs.state }}" = "active"
          echo "upload -> deploy -> ramp -> pause -> resume all behaved" >> "$GITHUB_STEP_SUMMARY"

      # --- the root action, which uses /release/ and is a separate path -----

      - name: the root action releases in one step
        if: steps.gate.outputs.run == 'true'
        id: rel
        uses: ./
        with:
          api-token:     ${{ secrets.SIMPLEOTA_TEST_API_TOKEN }}
          project-id:    ${{ vars.SIMPLEOTA_TEST_PROJECT_ID }}
          binary:        firmware-release.bin
          version-label: ci-release-${{ github.run_number }}
          chip-family:   esp32
          channel:       stable
          base-url:      ${{ vars.SIMPLEOTA_TEST_BASE_URL || 'https://simpleota.com' }}

      - name: the root action returned a started deployment
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -n "${{ steps.rel.outputs.build-number }}"
          test -n "${{ steps.rel.outputs.artifact-id }}"
          test -n "${{ steps.rel.outputs.deployment-id }}"
          echo "root action released build ${{ steps.rel.outputs.build-number }}" >> "$GITHUB_STEP_SUMMARY"

      # --- always clean up, so a failed run does not leave a live rollout ---

      - name: Cancel the deployments this run created
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -uo pipefail
          for dep in "${{ steps.dep.outputs.deployment-id }}" "${{ steps.rel.outputs.deployment-id }}"; do
            [ -n "$dep" ] || continue
            code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' \
              -X POST "${BASE_URL%/}/api/v1/projects/${PROJECT_ID}/deployments/${dep}/transition/" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"action":"cancel"}' || echo 000)"
            echo "cancel $dep -> HTTP $code"
          done
