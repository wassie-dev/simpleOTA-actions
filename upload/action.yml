name: 'SimpleOTA Upload'
description: 'Sign an ESP32 firmware binary and upload it to SimpleOTA without deploying it.'
author: 'Alexander Wasserman'

inputs:
  api-token:      {description: 'API-scoped SimpleOTA project token. Pass from secrets.', required: true}
  project-id:     {description: 'SimpleOTA project UUID.', required: true}
  binary:         {description: 'Path to the compiled application binary. Not a merged factory image.', required: true}
  version-label:  {description: 'Human-readable version for this build.', required: true}
  chip-family:    {description: 'Chip the build targets, e.g. esp32.', required: true}
  framework:      {description: 'arduino or esp_idf.', required: false, default: 'arduino'}
  board-id:       {description: 'Board identifier. Matched exactly when set.', required: false, default: ''}
  partition-profile: {description: 'Partition profile, e.g. min_spiffs.', required: false, default: ''}
  hardware-revision-min: {description: 'Lowest compatible hardware revision.', required: false, default: ''}
  hardware-revision-max: {description: 'Highest compatible hardware revision.', required: false, default: ''}
  release-notes:  {description: 'Release notes stored with the artifact.', required: false, default: ''}
  signing-key:    {description: 'Ed25519 private key PEM. Pass from secrets.', required: false, default: ''}
  key-id:         {description: 'Signing key id as registered on the project.', required: false, default: ''}
  security-mode:  {description: 'auto, basic, token or signed.', required: false, default: 'auto'}
  base-url:       {description: 'SimpleOTA base URL.', required: false, default: 'https://simpleota.com'}

outputs:
  build-number:
    description: 'Server-allocated build number.'
    value: ${{ steps.upload.outputs.build-number }}
  artifact-id:
    description: 'UUID of the uploaded artifact. Pass to the deploy action.'
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - name: Resolve security mode
      id: mode
      shell: bash
      env:
        SECURITY_MODE: ${{ inputs.security-mode }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        KEY_ID: ${{ inputs.key-id }}
      run: |
        set -euo pipefail
        MODE="$("${{ github.action_path }}/../scripts/resolve-security-mode.sh")"
        echo "value=$MODE" >> "$GITHUB_OUTPUT"

    - name: Sign firmware
      id: sign
      if: steps.mode.outputs.value == 'signed'
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        SIG="$("${{ github.action_path }}/../scripts/sign.sh")"
        echo "signature=$SIG" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      id: upload
      shell: bash
      env:
        FRAMEWORK: ${{ inputs.framework }}
        VERSION_LABEL: ${{ inputs.version-label }}
        CHIP_FAMILY: ${{ inputs.chip-family }}
        BOARD_ID: ${{ inputs.board-id }}
        PARTITION_PROFILE: ${{ inputs.partition-profile }}
        HARDWARE_REVISION_MIN: ${{ inputs.hardware-revision-min }}
        HARDWARE_REVISION_MAX: ${{ inputs.hardware-revision-max }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
        SECURITY_MODE: ${{ steps.mode.outputs.value }}
        KEY_ID: ${{ inputs.key-id }}
        SIGNATURE_B64: ${{ steps.sign.outputs.signature }}
        API_TOKEN: ${{ inputs.api-token }}
        PROJECT_ID: ${{ inputs.project-id }}
        BINARY: ${{ inputs.binary }}
        BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        [ -f "$BINARY" ] || { echo "::error::binary not found: $BINARY"; exit 1; }
        MANIFEST="$("${{ github.action_path }}/../scripts/manifest.sh")"

        RESP="$(curl --fail-with-body -sS \
          -X POST "${BASE_URL%/}/api/v1/projects/${PROJECT_ID}/artifacts/" \
          -H "Authorization: Bearer ${API_TOKEN}" \
          -F "manifest=${MANIFEST}" \
          -F "binary=@${BINARY}")"

        BUILD="$(jq -r '.build_number' <<<"$RESP")"
        echo "build-number=$BUILD"                        >> "$GITHUB_OUTPUT"
        echo "artifact-id=$(jq -r '.id' <<<"$RESP")"      >> "$GITHUB_OUTPUT"

        {
          echo "### SimpleOTA upload"
          echo ""
          echo "Build \`$BUILD\` (\`${VERSION_LABEL}\`, ${SECURITY_MODE}) uploaded. No deployment started."
        } >> "$GITHUB_STEP_SUMMARY"
